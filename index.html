<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>조선의 하루: 변화의 시대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16130f; --ink2:#241f19; --paper:#efe4cc; --paper2:#e2d3b2; --gold:#d4ad62; --gold2:#a9823f;
  --red:#a8322d; --jade:#4f8a7a; --txt:#2a2218; --mute:#7b6a50;
  --serif:'Gowun Batang',serif; --sans:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0c0a08;font-family:var(--sans);color:var(--paper);user-select:none;-webkit-user-select:none;touch-action:none}
#gl{position:fixed;inset:0;display:block;width:100%;height:100%}
button{font-family:inherit;cursor:pointer}
.hide{display:none!important}

/* ---------- 공통 패널(한지) ---------- */
.hanji{background:
  radial-gradient(120% 90% at 20% 10%,rgba(255,255,255,.35),transparent 60%),
  repeating-linear-gradient(17deg,rgba(120,90,40,.035) 0 2px,transparent 2px 6px),
  linear-gradient(180deg,#f3e9d3,#e6d6b4);
  color:var(--txt);border:1px solid #b99a62;box-shadow:0 18px 50px rgba(0,0,0,.55),inset 0 0 0 4px rgba(255,255,255,.25),inset 0 0 0 5px rgba(150,115,60,.35)}
.lacq{background:linear-gradient(180deg,rgba(34,28,22,.92),rgba(18,15,12,.92));border:1px solid rgba(212,173,98,.45);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,230,180,.12)}
.btn{border:1px solid var(--gold2);background:linear-gradient(180deg,#3a2f22,#231c15);color:#f5e6c4;padding:12px 22px;border-radius:4px;font-size:16px;letter-spacing:.04em;box-shadow:inset 0 1px 0 rgba(255,220,160,.2),0 4px 12px rgba(0,0,0,.35);transition:.15s}
.btn:hover{border-color:var(--gold);color:#fff;transform:translateY(-1px)}
.btn.red{background:linear-gradient(180deg,#b23a32,#7c221e);border-color:#d76b5d}
.btn.light{background:linear-gradient(180deg,#fbf3e1,#e8d8b6);color:var(--txt);border-color:#b99a62}
.btn:disabled{opacity:.45;pointer-events:none}
.seal{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;background:var(--red);color:#fbe9d8;font-family:var(--serif);font-weight:700;border-radius:4px;box-shadow:inset 0 0 0 2px rgba(255,220,200,.35);font-size:18px;flex:none}

/* ---------- 타이틀 ---------- */
#title{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(80% 70% at 50% 40%,rgba(10,8,6,.15),rgba(10,8,6,.78))}
#title .logo{text-align:center;margin-bottom:46px}
#title .sub{font-family:var(--serif);color:var(--gold);letter-spacing:.6em;font-size:15px;margin-bottom:14px;padding-left:.6em}
#title h1{font-family:var(--serif);font-size:clamp(40px,7vw,86px);margin:0;font-weight:700;color:#f8ecd2;letter-spacing:.08em;text-shadow:0 4px 30px rgba(0,0,0,.6),0 0 60px rgba(212,173,98,.25)}
#title h1 small{display:block;font-size:.36em;letter-spacing:.5em;color:#e9d3a6;margin-top:10px;font-weight:400;padding-left:.5em}
#title .menu{display:flex;flex-direction:column;gap:12px;width:min(300px,80vw)}
#title .menu .btn{font-size:18px;padding:14px}
#title .foot{position:absolute;bottom:18px;font-size:12px;color:rgba(240,225,190,.55);letter-spacing:.05em;text-align:center;padding:0 12px}
#loading{position:fixed;inset:0;z-index:60;background:#0c0a08;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-family:var(--serif);color:var(--gold)}
#loading .bar{width:220px;height:3px;background:#2a2219;overflow:hidden;border-radius:2px}
#loading .bar i{display:block;height:100%;width:30%;background:var(--gold);animation:ld 1.2s infinite ease-in-out}
@keyframes ld{0%{margin-left:-30%}100%{margin-left:100%}}

/* ---------- 시네마틱 ---------- */
#cine{position:fixed;inset:0;z-index:40;pointer-events:none}
#cine .bar{position:absolute;left:0;right:0;height:11vh;background:#000;transition:transform .9s cubic-bezier(.6,0,.2,1)}
#cine .bar.t{top:0;transform:translateY(-100%)} #cine .bar.b{bottom:0;transform:translateY(100%)}
#cine.on .bar{transform:none}
#cineCap{position:absolute;left:50%;bottom:15vh;transform:translateX(-50%);width:min(900px,90vw);text-align:center;font-family:var(--serif);font-size:clamp(17px,2.3vw,25px);line-height:1.6;color:#f6ead0;text-shadow:0 2px 12px #000,0 0 3px #000;opacity:0;transition:opacity .8s}
#cineCap.show{opacity:1}
#cineBig{position:absolute;left:0;right:0;top:38%;text-align:center;font-family:var(--serif);font-size:clamp(28px,5vw,58px);color:#f6ead0;letter-spacing:.2em;text-shadow:0 4px 30px rgba(0,0,0,.8);opacity:0;transition:opacity 1.2s}
#cineBig small{display:block;font-size:.35em;letter-spacing:.4em;color:var(--gold);margin-bottom:12px}
#cineBig.show{opacity:1}
#skip{position:fixed;right:18px;top:calc(11vh + 12px);z-index:41;pointer-events:auto;padding:8px 16px;font-size:14px}
#fade{position:fixed;inset:0;background:#000;z-index:45;opacity:0;pointer-events:none;transition:opacity .7s}
#fade.white{background:#fffbe9}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#quest{position:absolute;left:16px;top:14px;width:min(330px,46vw);padding:12px 14px 12px 14px;border-radius:6px}
#quest .ch{font-family:var(--serif);font-size:12px;letter-spacing:.2em;color:var(--gold);display:flex;justify-content:space-between;align-items:center}
#quest .ch b{font-weight:400;color:#cdb991;letter-spacing:.05em}
#quest .obj{font-size:15.5px;margin-top:6px;line-height:1.45;color:#fbf0d8;display:flex;gap:8px}
#quest .obj:before{content:'';flex:none;width:8px;height:8px;margin-top:7px;transform:rotate(45deg);background:var(--gold);box-shadow:0 0 8px var(--gold)}
#quest .dist{font-size:12px;color:#bfa77a;margin-top:6px;display:flex;align-items:center;gap:6px}
#quest .dist i{display:inline-block;width:14px;height:14px;transition:transform .2s}
#quest .prog{height:3px;background:rgba(255,255,255,.1);margin-top:9px;border-radius:2px;overflow:hidden}
#quest .prog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold2),var(--gold));transition:width .6s}
#topR{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
#coins{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border-radius:30px;font-family:var(--serif);font-size:18px;color:#f7e7c3}
#coins svg{width:28px;height:28px}
#coins.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.15)}}
#menuBtns{display:flex;gap:6px}
.ib{width:46px;height:46px;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ecd9b0;font-size:10.5px;gap:2px;border:1px solid rgba(212,173,98,.4);background:linear-gradient(180deg,rgba(40,33,25,.9),rgba(20,16,12,.9));position:relative}
.ib svg{width:20px;height:20px;stroke:#e6c98c;fill:none;stroke-width:1.6}
.ib:hover{border-color:var(--gold)}
.ib .dot{position:absolute;top:5px;right:6px;width:8px;height:8px;border-radius:50%;background:#e0503f;box-shadow:0 0 6px #e0503f}
#minimap{width:150px;height:150px;border-radius:50%;border:2px solid rgba(212,173,98,.65);box-shadow:0 6px 20px rgba(0,0,0,.5),inset 0 0 20px rgba(0,0,0,.5);background:#2b3a26;cursor:pointer}
#region{font-family:var(--serif);font-size:13px;color:#e7d4ac;text-align:center;width:150px;text-shadow:0 1px 4px #000;letter-spacing:.1em}

/* 상호작용 안내 */
#prompt{position:fixed;z-index:12;transform:translate(-50%,-100%);pointer-events:none;display:flex;align-items:center;gap:8px;padding:7px 14px 7px 7px;border-radius:30px;font-size:15px;color:#fff;background:rgba(20,16,12,.82);border:1px solid rgba(212,173,98,.6);white-space:nowrap;transition:opacity .15s}
#prompt kbd{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:#1a140c;font-weight:700;font-family:var(--serif);font-size:14px}
#prompt small{color:#d9c597;font-size:12px;margin-left:2px}
#qmark{position:fixed;z-index:11;pointer-events:none;transform:translate(-50%,-50%);width:38px;height:38px;display:none}
#qmark svg{width:100%;height:100%;filter:drop-shadow(0 0 6px rgba(255,200,90,.8))}

/* 대화창 */
#dialog{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(880px,94vw);z-index:30;padding:20px 26px 18px;border-radius:4px;min-height:132px;display:none}
#dialog.show{display:block;animation:dlg .25s ease-out}
@keyframes dlg{from{opacity:0;transform:translate(-50%,14px)}}
#dName{position:absolute;top:-19px;left:22px;padding:6px 18px 6px 12px;background:linear-gradient(180deg,#2e251b,#18130e);color:#f3dfb4;font-family:var(--serif);font-size:16px;border:1px solid var(--gold2);border-radius:3px;display:flex;align-items:center;gap:8px}
#dName i{width:10px;height:10px;border-radius:50%;display:inline-block}
#dName small{color:#b99f72;font-size:12px}
#dText{font-size:clamp(16px,2vw,19px);line-height:1.7;color:var(--txt);min-height:58px;white-space:pre-line}
#dText b{color:var(--red)}
#dText em{font-style:normal;color:#2d5f53;font-weight:700}
#dChoices{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#dChoices button{text-align:left;padding:11px 16px;font-size:16px;border:1px solid #b99a62;background:rgba(255,255,255,.45);color:var(--txt);border-radius:3px}
#dChoices button:hover,#dChoices button:focus{background:#2a2218;color:#f5e6c4;outline:none}
#dNext{position:absolute;right:20px;bottom:12px;color:var(--red);font-size:13px;animation:nx 1s infinite}
@keyframes nx{50%{transform:translateY(3px);opacity:.6}}
#dLearn{display:none;margin-top:10px;padding:10px 12px;border-left:3px solid var(--jade);background:rgba(79,138,122,.12);font-size:14.5px;line-height:1.6;color:#23443b}
#dLearn:before{content:'역사 노트  ';font-weight:700;color:var(--jade)}

/* 모달 패널 */
#modal{position:fixed;inset:0;z-index:55;display:none;align-items:center;justify-content:center;background:rgba(8,6,4,.55);backdrop-filter:blur(3px)}
#modal.show{display:flex;animation:fi .25s}
@keyframes fi{from{opacity:0}}
#mBox{width:min(820px,94vw);max-height:90vh;display:flex;flex-direction:column;border-radius:4px;position:relative}
#mHead{display:flex;align-items:center;gap:12px;padding:16px 22px 12px;border-bottom:1px solid rgba(150,115,60,.35)}
#mHead h2{margin:0;font-family:var(--serif);font-size:22px;color:#3a2a18;flex:1}
#mHead .x{border:none;background:none;font-size:26px;color:#7b6a50;width:40px;height:40px}
#mBody{padding:16px 22px;overflow:auto;font-size:16px;line-height:1.65;color:var(--txt)}
#mFoot{padding:12px 22px 18px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
#mBody h3{font-family:var(--serif);margin:.4em 0 .3em;color:#5a3c1c}
#mBody .note{font-size:13px;color:var(--mute)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}
.card{border:1px solid #c7ab76;background:rgba(255,255,255,.4);border-radius:4px;padding:12px 14px}
.card h4{margin:0 0 6px;font-family:var(--serif);font-size:17px;color:#4a321a}
.pick{display:flex;flex-wrap:wrap;gap:10px}
.pick button{flex:1 1 150px;padding:12px;border:1px solid #b99a62;background:rgba(255,255,255,.5);border-radius:4px;font-size:15px;color:var(--txt);text-align:left;line-height:1.45}
.pick button.sel{background:#2a2218;color:#f5e6c4;border-color:#2a2218}
.pick button.ok{background:#d9eadf;border-color:#4f8a7a}
.pick button.no{background:#f2d6cf;border-color:#a8322d;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bars{display:flex;flex-direction:column;gap:10px;margin:10px 0}
.barrow{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:10px;font-size:14.5px}
.barrow .tr{height:22px;background:rgba(0,0,0,.08);border-radius:3px;overflow:hidden}
.barrow .tr i{display:block;height:100%;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1);border-radius:3px}
.barrow b{text-align:right;font-family:var(--serif)}
.tcode{width:100%;font-size:26px;letter-spacing:.5em;text-align:center;padding:12px;border:1px solid #b99a62;border-radius:4px;background:#fffaf0;font-family:var(--serif);color:#2a2218}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:#2a2218;color:#f1dfb8;margin-right:4px}

/* 상점 */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:640px){.shop{grid-template-columns:1fr}}
.shop h4{margin:0 0 8px;font-family:var(--serif)}
.srow{display:flex;align-items:center;gap:8px;padding:8px 6px;border-bottom:1px dashed rgba(150,115,60,.35);font-size:15px}
.srow .nm{flex:1}
.srow .pr{font-family:var(--serif);color:#6b4a1d;width:70px;text-align:right}
.srow button{padding:7px 12px;border-radius:3px;border:1px solid #8c6d3a;background:#2a2218;color:#f5e6c4;font-size:14px;min-width:54px}
.srow button:disabled{opacity:.35}
.ico{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;color:#fff;flex:none}

/* 도감 */
.codex{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cx{border:1px solid #c7ab76;border-radius:4px;padding:10px 12px;background:rgba(255,255,255,.4);display:flex;gap:10px;cursor:pointer;min-height:66px}
.cx.lock{opacity:.4;filter:grayscale(1);cursor:default}
.cx .t{font-family:var(--serif);font-weight:700;font-size:15.5px;color:#3a2a18}
.cx .s{font-size:12.5px;color:var(--mute)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{padding:6px 12px;border-radius:16px;border:1px solid #b99a62;background:transparent;font-size:13.5px;color:var(--txt)}
.tabs button.on{background:#2a2218;color:#f5e6c4}

/* 미니게임 HUD */
#mg{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:22;padding:10px 18px;border-radius:6px;display:none;text-align:center;min-width:240px}
#mg.show{display:block}
#mg .t{font-family:var(--serif);color:var(--gold);font-size:13px;letter-spacing:.15em}
#mg .v{font-size:20px;color:#fff;margin-top:2px;font-family:var(--serif)}
#mg .h{font-size:13px;color:#cdb991;margin-top:3px}

/* 터치 조작 */
#joy{position:fixed;left:22px;bottom:22px;width:150px;height:150px;border-radius:50%;z-index:14;background:radial-gradient(circle,rgba(255,240,210,.08),rgba(255,240,210,.03) 60%,transparent 70%);border:2px solid rgba(232,210,160,.35);touch-action:none;display:none}
#joy i{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5e3b8,#b4924f);box-shadow:0 4px 14px rgba(0,0,0,.5);opacity:.9}
#tbtns{position:fixed;right:20px;bottom:24px;z-index:14;display:none;align-items:flex-end;gap:14px}
.tb{width:84px;height:84px;border-radius:50%;border:2px solid rgba(232,210,160,.55);background:radial-gradient(circle at 40% 30%,rgba(70,56,40,.92),rgba(24,19,14,.92));color:#f4e1b5;font-family:var(--serif);font-size:16px;display:flex;align-items:center;justify-content:center;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.45);touch-action:none}
.tb.big{width:104px;height:104px;font-size:19px;border-color:var(--gold)}
.tb.sm{width:66px;height:66px;font-size:13px}
.tb.on{background:radial-gradient(circle,#c9a45c,#7c5f2c);color:#1a140c}
.tb.glow{box-shadow:0 0 0 4px rgba(212,173,98,.35),0 0 24px rgba(212,173,98,.7)}
body.touch.playing #tbtns{display:flex}
body.touch.playing #joy{display:block}
#ctrlHelp{position:fixed;left:16px;bottom:14px;z-index:9;font-size:12.5px;color:rgba(240,225,190,.7);text-shadow:0 1px 3px #000;line-height:1.7}
body.touch #ctrlHelp{display:none}
#ctrlHelp kbd{display:inline-block;padding:0 6px;border:1px solid rgba(240,225,190,.5);border-radius:3px;margin-right:3px;font-family:inherit}

/* 미니게임 조작 바 */
#mgBar{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:22;display:none;gap:10px;padding:12px;border-radius:8px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:96vw}
#mgBar.show{display:flex}
#mgBar .btn{padding:14px 18px;font-size:16px;touch-action:none}

/* 토스트 */
#toasts{position:fixed;left:50%;top:90px;transform:translateX(-50%);z-index:58;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;padding:10px 20px 10px 10px;border-radius:4px;font-size:15px;color:#f8eacb;animation:tin .4s ease-out,tout .5s ease-in forwards;animation-delay:0s,var(--d,3.2s)}
.toast b{font-family:var(--serif);color:var(--gold);display:block;font-size:12px;letter-spacing:.15em;font-weight:400}
@keyframes tin{from{opacity:0;transform:translateY(-12px)}}
@keyframes tout{to{opacity:0;transform:translateY(-8px)}}

/* 천리경 */
#scope{position:fixed;inset:0;z-index:20;pointer-events:none;display:none;background:radial-gradient(circle at 50% 50%,transparent 0,transparent min(34vw,34vh),rgba(0,0,0,.6) calc(min(34vw,34vh) + 2px),#000 calc(min(34vw,34vh) + 20px))}
#scope.show{display:block}
#scope:after{content:'';position:absolute;left:50%;top:50%;width:min(68vw,68vh);height:min(68vw,68vh);transform:translate(-50%,-50%);border-radius:50%;box-shadow:inset 0 0 0 3px rgba(212,173,98,.7),inset 0 0 60px rgba(0,0,0,.6)}
#scope i{position:absolute;left:50%;top:50%;background:rgba(255,240,200,.45)}
#scope i.h{width:40px;height:1px;margin-left:-20px} #scope i.v{width:1px;height:40px;margin-top:-20px}

/* 레버 미터 */
.meter{width:220px}
.meter .lb{display:flex;justify-content:space-between;font-size:13px;color:#d8c49b}
.meter .tr{height:12px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden;position:relative;margin-top:3px}
.meter .tr i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4f8a7a,#9fd3b8);transition:width .3s}
.meter .tr u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#ffcf6a}
.gauge{position:fixed;right:24px;top:50%;transform:translateY(-50%);width:54px;height:min(56vh,380px);z-index:16;border-radius:6px;display:none}
.gauge.show{display:block}
.gauge .tr{position:absolute;left:18px;right:18px;top:14px;bottom:30px;background:rgba(255,255,255,.08);border-radius:4px}
.gauge .band{position:absolute;left:-6px;right:-6px;background:rgba(120,220,150,.35);border:1px solid #8fe0a8}
.gauge .cur{position:absolute;left:-10px;right:-10px;height:4px;background:#ffcf6a;box-shadow:0 0 8px #ffcf6a}
.gauge .lb{position:absolute;bottom:6px;left:0;right:0;text-align:center;font-size:11px;color:#d8c49b}

@media(max-width:760px){
  #quest{width:min(300px,58vw);padding:9px 11px}
  #quest .obj{font-size:14px}
  #minimap{width:112px;height:112px} #region{width:112px;font-size:12px}
  .ib{width:40px;height:40px;font-size:0} .ib svg{width:20px;height:20px}
  #dialog{bottom:12px;padding:18px 18px 16px}
  body.touch #dialog{bottom:12px}
}
body.dialog #joy,body.dialog #tbtns,body.modal #joy,body.modal #tbtns{opacity:.15;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
/* =========================================================
   조선의 하루 : 변화의 시대  —  ENGINE
   ========================================================= */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rand = (a, b) => a + Math.random() * (b - a);
const wait = ms => new Promise(r => setTimeout(r, ms));
let seed = 1234; const srand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

/* ---------- 노이즈 ---------- */
function hash(x, y) { const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const a = hash(ix, iy), b = hash(ix + 1, iy), c = hash(ix, iy + 1), d = hash(ix + 1, iy + 1);
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  return lerp(lerp(a, b, ux), lerp(c, d, ux), uy);
}
function fbm(x, y) { let v = 0, a = .5, f = 1; for (let i = 0; i < 4; i++) { v += a * vnoise(x * f, y * f); f *= 2.03; a *= .5; } return v; }

/* ---------- 렌더러 ---------- */
const canvas = $('#gl');
const R = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
if (IS_TOUCH) document.body.classList.add('touch');
let QUALITY = 'high';
R.setPixelRatio(Math.min(window.devicePixelRatio || 1, IS_TOUCH ? 1.5 : 1.75));
R.setSize(innerWidth, innerHeight);
R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.outputEncoding = THREE.sRGBEncoding;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.0;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 1400);
camera.position.set(0, 30, 60);
scene.fog = new THREE.Fog(0xcfd9d6, 120, 620);

addEventListener('resize', () => { R.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

/* ---------- 하늘 ---------- */
const skyU = { top: { value: new THREE.Color(0x5b8fc4) }, mid: { value: new THREE.Color(0xbfd5e0) }, bot: { value: new THREE.Color(0xe8e0cc) }, sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: new THREE.Color(0xfff1d0) }, t: { value: 0 } };
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false, uniforms: skyU,
  vertexShader: 'varying vec3 vP;void main(){vP=normalize(position);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: `varying vec3 vP;uniform vec3 top,mid,bot,sunDir,sunCol;uniform float t;
  float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5);}
  float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y);}
  void main(){float y=vP.y;vec3 c=y>0.?mix(mid,top,pow(clamp(y*1.6,0.,1.),.8)):mix(mid,bot,clamp(-y*6.,0.,1.));
  float s=max(dot(vP,normalize(sunDir)),0.);c+=sunCol*(pow(s,600.)*3.+pow(s,12.)*.35+pow(s,3.)*.12);
  vec2 q=vP.xz/(vP.y+.25)*2.+vec2(t*.01,0.);float cl=n(q)*.6+n(q*2.3)*.3+n(q*5.)*.1;cl=smoothstep(.55,.85,cl)*smoothstep(0.,.25,y);
  c=mix(c,mix(vec3(1.),sunCol,.35)*(.85+.3*s),cl*.55);gl_FragColor=vec4(c,1.);}`
}));
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x6b5a3a, 0.75); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff0d6, 1.6);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
const SC = sun.shadow.camera; SC.left = -55; SC.right = 55; SC.top = 55; SC.bottom = -55; SC.near = 1; SC.far = 260;
sun.shadow.bias = -0.0006; sun.shadow.normalBias = 0.03;
scene.add(sun); scene.add(sun.target);
const ambient = new THREE.AmbientLight(0xffffff, 0.12); scene.add(ambient);

/* 시간대: 0 아침 ~ 0.5 한낮 ~ 1 해질녘 */
const TOD = { v: 0.25, target: 0.25 };
const tmpC = new THREE.Color();
function applyTOD(dt) {
  TOD.v = lerp(TOD.v, TOD.target, 1 - Math.exp(-dt * 0.6));
  const t = TOD.v;
  const ang = lerp(0.35, 2.85, t) ; // 태양 방위
  const elev = Math.sin(lerp(0.25, Math.PI - 0.12, t)) * 0.9 + 0.08;
  const dir = new THREE.Vector3(Math.cos(ang) * 0.7, elev, -Math.sin(ang) * 0.6 - 0.35).normalize();
  skyU.sunDir.value.copy(dir);
  const eve = smooth(0.7, 1.0, t), morn = 1 - smooth(0.0, 0.2, t);
  skyU.top.value.set(0x4f86c2).lerp(tmpC.set(0x2e3f73), eve * 0.85);
  skyU.mid.value.set(0xbcd4df).lerp(tmpC.set(0xf0a56b), eve).lerp(tmpC.set(0xf3d9b8), morn * 0.5);
  skyU.bot.value.set(0xe6dfcb).lerp(tmpC.set(0xd98a5c), eve);
  skyU.sunCol.value.set(0xfff1d6).lerp(tmpC.set(0xff8a45), eve);
  sun.color.set(0xfff0d6).lerp(tmpC.set(0xff9a5a), eve).lerp(tmpC.set(0xffd9a8), morn * .5);
  sun.intensity = lerp(1.7, 1.05, eve);
  hemi.intensity = lerp(0.78, 0.5, eve);
  hemi.color.set(0xcfe3ff).lerp(tmpC.set(0xffb98a), eve);
  scene.fog.color.copy(skyU.mid.value).lerp(skyU.bot.value, .4).convertSRGBToLinear();
  R.toneMappingExposure = lerp(1.0, 0.92, eve);
  WORLD.lanternOn = eve > 0.45;
  return dir;
}

/* ---------- 재질 ---------- */
const MATS = {};
function M(hex, o = {}) {
  const k = hex + JSON.stringify(o);
  if (!MATS[k]) { MATS[k] = new THREE.MeshStandardMaterial(Object.assign({ color: new THREE.Color(hex).convertSRGBToLinear(), roughness: 0.88, metalness: 0, flatShading: true }, o)); if (o.emissive !== undefined) MATS[k].emissive.convertSRGBToLinear(); MATS[k].userData.lin = true; }
  return MATS[k];
}
function mesh(geo, mat, x = 0, y = 0, z = 0, cast = true, recv = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = cast; m.receiveShadow = recv; return m;
}
const BOX = new THREE.BoxGeometry(1, 1, 1);
const CYL = new THREE.CylinderGeometry(1, 1, 1, 8);
const SPH = new THREE.IcosahedronGeometry(1, 1);
function box(w, h, d, mat, x, y, z, parent) { const m = mesh(BOX, mat, x, y, z); m.scale.set(w, h, d); if (parent) parent.add(m); return m; }
function cyl(r, h, mat, x, y, z, parent, seg) { const m = mesh(seg ? new THREE.CylinderGeometry(r, r, h, seg) : CYL, mat, x, y, z); if (!seg) m.scale.set(r, h, r); if (parent) parent.add(m); return m; }

/* ---------- 지형 ---------- */
const streamX = z => 28 + 6 * Math.sin(z * 0.03) + 3 * Math.sin(z * 0.071 + 1);
const BRIDGE = { z: 0, half: 2.3 };
function terrainH(x, z) {
  let h = 0;
  const r = Math.hypot(x, z);
  const nn = fbm(x * 0.02 + 10, z * 0.02 - 4);
  h += smooth(140, 215, r) * (34 + 40 * nn);
  // 북쪽 능선 (화성 쪽 골짜기 제외)
  if (x < 25) {
    const d = Math.abs(z + 78);
    const gap = 1 - smooth(5.5, 9.5, Math.abs(x));
    const endFade = smooth(25, 18, x);
    h += Math.max(0, 1 - d / 10) ** 0.8 * (10 + 5 * nn) * (1 - gap) * endFade;
  }
  // 서쪽 능선 (학문 구역 고개 제외)
  if (z > -82) {
    const d = Math.abs(x + 50);
    const gap = 1 - smooth(5, 9, Math.abs(z + 20));
    h += Math.max(0, 1 - d / 9) ** 0.8 * (9 + 4 * nn) * (1 - gap);
  }
  // 개울
  const sd = Math.abs(x - streamX(z));
  if (sd < 5) h -= (1 - sd / 5) ** 1.5 * 1.6;
  // 언덕 기복 (마을 밖)
  const village = Math.min(r / 120, 1);
  h += (fbm(x * 0.05, z * 0.05) - 0.5) * 0.6 * village * smooth(60, 110, r);
  return h;
}
const GATES = {};      // 지역 차단 장치
function walkable(x, z) {
  const sd = Math.abs(x - streamX(z));
  if (sd < 4.2) { if (!(GATES.bridge && GATES.bridge.open && Math.abs(z - BRIDGE.z) < BRIDGE.half - .4)) return false; else return true; }
  const h = terrainH(x, z);
  if (h > 1.1) return false;
  if (Math.hypot(x, z) > 150) return false;
  return true;
}
function groundY(x, z) {
  const sd = Math.abs(x - streamX(z));
  if (sd < 5.2 && Math.abs(z - BRIDGE.z) < BRIDGE.half) return 0.55 - Math.max(0, (sd - 3.5)) * 0.2;
  return Math.max(terrainH(x, z), -0.3);
}

/* ---------- 충돌체 ---------- */
const COLL = [];    // {x,z,hw,hd,rot}
function addColl(x, z, w, d, rot = 0, tag) { const c = { x, z, hw: w / 2, hd: d / 2, rot, cos: Math.cos(rot), sin: Math.sin(rot), tag }; COLL.push(c); return c; }
function addCircle(x, z, r, tag) { const c = { x, z, r, circle: true, tag }; COLL.push(c); return c; }
const CGRID = new Map(); let CGN = -1;
function cgKey(ix, iz) { return ix * 4096 + iz; }
function buildCGrid() {
  CGRID.clear(); CGN = COLL.length;
  for (const c of COLL) { const r = c.circle ? c.r : c.hw + c.hd; const x0 = Math.floor((c.x - r - 1) / 8), x1 = Math.floor((c.x + r + 1) / 8), z0 = Math.floor((c.z - r - 1) / 8), z1 = Math.floor((c.z + r + 1) / 8); for (let i = x0; i <= x1; i++) for (let j = z0; j <= z1; j++) { const k = cgKey(i, j); if (!CGRID.has(k)) CGRID.set(k, []); CGRID.get(k).push(c); } }
}
function hits(x, z, rad, skipNpc) {
  if (CGN !== COLL.length) buildCGrid();
  const cell = CGRID.get(cgKey(Math.floor(x / 8), Math.floor(z / 8))); if (!cell) return false;
  for (const c of cell) {
    if (c.off || (skipNpc && c.tag === 'npc')) continue;
    const dx = x - c.x, dz = z - c.z;
    if (c.circle) { if (dx * dx + dz * dz < (c.r + rad) ** 2) return true; continue; }
    if (Math.abs(dx) > c.hw + c.hd + rad + 1 && Math.abs(dz) > c.hw + c.hd + rad + 1) continue;
    const lx = dx * c.cos - dz * c.sin, lz = dx * c.sin + dz * c.cos;
    const px = clamp(lx, -c.hw, c.hw), pz = clamp(lz, -c.hd, c.hd);
    if ((lx - px) ** 2 + (lz - pz) ** 2 < rad * rad) return true;
  }
  return false;
}
function canStand(x, z, rad = 0.45) {
  if (!walkable(x, z) || !walkable(x + rad, z) || !walkable(x - rad, z) || !walkable(x, z + rad) || !walkable(x, z - rad)) return false;
  return !hits(x, z, rad);
}

/* ---------- 사람 모형 ---------- */
const SKIN = [0xe9c3a0, 0xdcb08a, 0xe3b995, 0xd2a37c];
function makeHuman(o = {}) {
  const g = new THREE.Group();
  const s = o.scale || 1;
  const skin = M(o.skin || SKIN[0]);
  const top = M(o.top || 0xe8e0cc), bot = M(o.bottom || 0xd9d0bb), dark = M(0x1d1915), belt = M(o.belt || 0x6b4c2e);
  const root = new THREE.Group(); g.add(root);
  // 다리
  const legG = new THREE.CylinderGeometry(0.13, 0.11, 0.75, 7);
  const mkLeg = sx => { const p = new THREE.Group(); p.position.set(sx, 0.82, 0); const l = mesh(legG, bot, 0, -0.38, 0); p.add(l); const sh = mesh(new THREE.BoxGeometry(0.17, 0.1, 0.3), M(o.shoe || 0xb59a6a), 0, -0.78, 0.05); p.add(sh); root.add(p); return p; };
  const lLeg = mkLeg(-0.13), rLeg = mkLeg(0.13);
  // 바지 대님 / 치마
  if (o.skirt) { const sk = mesh(new THREE.CylinderGeometry(0.28, 0.48, 0.95, 10), bot, 0, 0.62, 0); root.add(sk); }
  else { const hip = mesh(new THREE.CylinderGeometry(0.27, 0.3, 0.3, 9), bot, 0, 0.88, 0); root.add(hip); }
  // 몸통 (저고리)
  const body = mesh(new THREE.CylinderGeometry(0.25, 0.3, 0.62, 9), top, 0, 1.28, 0); root.add(body);
  if (o.robe) { const rb = mesh(new THREE.CylinderGeometry(0.3, 0.46, 1.05, 10), M(o.robe), 0, 0.95, 0); root.add(rb); }
  const bl = mesh(new THREE.CylinderGeometry(0.29, 0.29, 0.06, 9), belt, 0, o.skirt ? 1.12 : 1.02, 0); root.add(bl);
  if (o.skirt) { const go = mesh(new THREE.BoxGeometry(0.06, 0.28, 0.02), M(o.ribbon || 0xa8322d), 0.06, 1.33, 0.27); go.rotation.z = .2; root.add(go); }
  // 팔
  const armG = new THREE.CylinderGeometry(0.085, 0.075, 0.6, 6);
  const mkArm = sx => { const p = new THREE.Group(); p.position.set(sx, 1.52, 0); const a = mesh(armG, top, 0, -0.28, 0); p.add(a); const hd = mesh(SPH, skin, 0, -0.6, 0); hd.scale.setScalar(0.07); p.add(hd); root.add(p); return p; };
  const lArm = mkArm(-0.33), rArm = mkArm(0.33);
  // 머리
  const head = new THREE.Group(); head.position.set(0, 1.78, 0); root.add(head);
  const hm = mesh(new THREE.IcosahedronGeometry(0.2, 1), skin, 0, 0.02, 0); hm.scale.set(1, 1.08, 1); head.add(hm);
  const neck = mesh(new THREE.CylinderGeometry(0.07, 0.08, 0.12, 6), skin, 0, 1.63, 0); root.add(neck);
  // 눈
  const eyeG = new THREE.SphereGeometry(0.022, 6, 4);
  head.add(mesh(eyeG, dark, -0.07, 0.04, 0.18, false)); head.add(mesh(eyeG, dark, 0.07, 0.04, 0.18, false));
  const hair = M(o.hairColor || 0x1b1612);
  const hairCap = mesh(new THREE.SphereGeometry(0.205, 10, 6, 0, Math.PI * 2, 0, Math.PI * 0.55), hair, 0, 0.05, -0.01); head.add(hairCap);
  const kind = o.hair || 'sangtu';
  if (kind === 'sangtu' || kind === 'gat' || kind === 'manggeon') { const st = mesh(new THREE.CylinderGeometry(0.05, 0.065, 0.12, 6), hair, 0, 0.24, -0.02); head.add(st); }
  if (kind === 'manggeon' || kind === 'gat') { const mg = mesh(new THREE.CylinderGeometry(0.21, 0.21, 0.05, 12), dark, 0, 0.1, 0); head.add(mg); }
  if (kind === 'gat') {

  const ropeMat = new THREE.LineBasicMaterial({ color: 0x3a2a18 });

  CRANE.rope = new THREE.LineSegments(rg, ropeMat); g.add(CRANE.rope);

function updateCrane(dt) {
  if (!CRANE.g) return;
  const lowY = CRANE.h + 1.2 + 1.6 + 0.3;
  CRANE.stone.position.y = 0.6 + CRANE.h; CRANE.stone.position.z = CRANE.push || 0;
  CRANE.low.position.set(0, lowY, CRANE.push || 0);
  const p = CRANE.rope.geometry.attributes.position; let k = 0;
  const n = CRANE.strands, topY = CRANE.H - 1.3;
  const set = (x1, y1, z1, x2, y2, z2) => { p.setXYZ(k++, x1, y1, z1); p.setXYZ(k++, x2, y2, z2); };
  const xs = n === 1 ? [0] : n === 2 ? [-0.3, 0.3] : n === 4 ? [-0.9, -0.3, 0.3, 0.9] : [-1.0, -0.7, -0.4, -0.1, 0.1, 0.4, 0.7, 1.0];
  for (const x of xs) set(x, topY, 0, x, lowY + 0.35, CRANE.push || 0);
  set(-3.2, 1.1, 2.4, xs[0] - 0.1, topY, 0); if (n > 1) set(3.2, 1.1, 2.4, xs[xs.length - 1] + 0.1, topY, 0);
  if (n === 1) { set(0, lowY + 0.35, CRANE.push || 0, 0, lowY - 0.3, CRANE.push || 0); }
  while (k < 32) p.setXYZ(k++, 0, -50, 0);
  p.needsUpdate = true;
  CRANE.lowP.forEach((pp, i) => pp.visible = n >= 2 && i < Math.max(1, n / 2));
  CRANE.topP.forEach((pp, i) => pp.visible = i < Math.max(1, Math.ceil(n / 2)));
}

function say(lines) {
  return new Promise(res => {
    if (!Array.isArray(lines)) lines = [lines];
    let i = 0, picked = -1;
    DLG.on = true; document.body.classList.add('dialog'); $('#dialog').classList.add('show');
    const show = () => {
      const L = lines[i]; const sp = SPEAKERS[L.s] || [L.s || '', '#d4ad62', ''];
      const nm = $('#dName'); if (L.s === 'narr') nm.style.display = 'none'; else { nm.style.display = ''; nm.querySelector('span').textContent = L.name || sp[0]; nm.querySelector('i').style.background = sp[1]; nm.querySelector('small').textContent = L.sub ?? sp[2]; }
      $('#dLearn').style.display = L.learn ? 'block' : 'none'; $('#dLearn').innerHTML = L.learn || '';
      const ch = $('#dChoices'); ch.innerHTML = ''; DLG.choices = null; $('#dNext').style.display = 'none';
      DLG.full = L.t; DLG.idx = 0; DLG.typing = true; const tx = $('#dText'); tx.innerHTML = '';
      const plain = L.t;
      clearInterval(DLG.timer);
      const sp2 = 16 / SETTINGS.textSpeed;
      DLG.timer = setInterval(() => {
        DLG.idx += 2; if (DLG.idx % 6 === 0) sfx('talk');
        if (DLG.idx >= plain.length) { finishType(); return; }
        tx.innerHTML = fmt(plain.slice(0, DLG.idx));
      }, sp2);
      S.log.push({ n: L.s === 'narr' ? '' : (L.name || sp[0]), t: L.t.replace(/[*_]/g, '') }); if (S.log.length > 250) S.log.shift();
    };
    const finishType = () => {
      clearInterval(DLG.timer); DLG.typing = false; $('#dText').innerHTML = fmt(DLG.full);
      const L = lines[i];
      if (L.c) {
        const ch = $('#dChoices'); DLG.choices = L.c;
        L.c.forEach((c, k) => { const b = document.createElement('button'); b.innerHTML = `<span style="color:#a8322d;margin-right:8px">${k + 1}.</span>${c}`; b.onclick = e => { e.stopPropagation(); pick(k); }; ch.appendChild(b); });
      } else $('#dNext').style.display = '';
    };
    const pick = k => { sfx('click'); picked = k; const L = lines[i]; if (L.then) { const r = L.then(k); if (r && r.length) { lines.splice(i + 1, 0, ...r); } } next(true); };
    const next = (fromPick) => {
      if (DLG.typing) { finishType(); return; }
      if (DLG.choices && !fromPick) return;
      i++; if (i >= lines.length) { close(); return; } show();
    };
    const close = () => { clearInterval(DLG.timer); DLG.on = false; DLG.adv = null; DLG.pick = null; $('#dialog').classList.remove('show'); document.body.classList.remove('dialog'); setTimeout(() => res(picked), 60); };
    DLG.adv = () => next(false); DLG.pick = pick;
    show();
  });
}

    $('#mBody').innerHTML = html; const f = $('#mFoot'); f.innerHTML = '';

const MAPC = document.createElement('canvas'); MAPC.width = MAPC.height = 640;  // ±160 → 2px/unit
const MAP_R = 160, MAP_S = 640 / (MAP_R * 2);

function buildMapImage() {
  const g = MAPC.getContext('2d'); const img = g.createImageData(640, 640);
  for (let py = 0; py < 640; py += 2) for (let px = 0; px < 640; px += 2) {
    const x = px / MAP_S - MAP_R, z = py / MAP_S - MAP_R; const h = terrainH(x, z);
    let r = 120, gg = 140, b = 90;
    if (h > 1.2) { const k = Math.min(h / 30, 1); r = 92 - k * 30; gg = 112 - k * 30; b = 74 - k * 20; }
    if (Math.abs(x - streamX(z)) < 4) { r = 110; gg = 150; b = 165; }
    if (pathDist(x, z) < 1.8) { r = 190; gg = 168; b = 128; }
    const sh = (vnoise(x * .2, z * .2) - .5) * 12;
    for (let dy = 0; dy < 2; dy++) for (let dx = 0; dx < 2; dx++) { const i = ((py + dy) * 640 + px + dx) * 4; img.data[i] = r + sh; img.data[i + 1] = gg + sh; img.data[i + 2] = b + sh; img.data[i + 3] = 255; }
  }
  g.putImageData(img, 0, 0);
  for (const k in FIELDS) { const f = FIELDS[k]; const [a, b] = w2m(f.x - f.w / 2, f.z - f.d / 2); g.fillStyle = f.water || k === 'C' ? 'rgba(120,150,140,.9)' : 'rgba(120,90,60,.9)'; g.fillRect(a, b, f.w * MAP_S, f.d * MAP_S); }

  for (const c of COLL) { if (c.circle || c.tag) continue; if (c.hw * c.hd < 1.5) continue; g.save(); const [a, b] = w2m(c.x, c.z); g.translate(a, b); g.rotate(-c.rot); g.fillRect(-c.hw * MAP_S, -c.hd * MAP_S, c.hw * 2 * MAP_S, c.hd * 2 * MAP_S); g.restore(); }

  let auto = false; try { auto = sessionStorage.getItem('jh-auto') === '1'; sessionStorage.removeItem('jh-auto'); } catch (e) { }
  if (auto && loadGame()) continueGame();
  loop();
}
function bakeStaticChunks(root) {
  // 위치별로 나눠 병합 → 시야 밖 조각은 그리지 않음
  root.updateMatrixWorld(true);
  const chunks = new Map();
  [...root.children].forEach(ch => { const p = new THREE.Vector3(); ch.getWorldPosition(p); const key = Math.floor(p.x / 50) + ',' + Math.floor(p.z / 50); if (!chunks.has(key)) chunks.set(key, new THREE.Group()); chunks.get(key).add(ch); });
  const out = new THREE.Group();
  chunks.forEach(g => { g.updateMatrixWorld(true); out.add(bakeStatic(g)); });
  return out;
}
window.addEventListener('error', e => { console.warn('error', e.message); });
init();
